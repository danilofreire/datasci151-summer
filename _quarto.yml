project:
  type: website
  output-dir: docs
  resources:
    - lectures/**
  post-render:
    - jupyter/build.sh

website:
  title: "DATASCI 151"
  page-navigation: true
  back-to-top-navigation: true
  reader-mode: false
  repo-url: https://github.com/danilofreire/datasci151-summer
  repo-actions: [issue, source]
  repo-branch: gh-pages
  navbar:
    pinned: true
    tools:
      - icon: github
        href: https://github.com/danilofreire/datasci151-summer
    left:
      - href: syllabus.qmd
        text: Syllabus
        icon: journal-text
      - href: lectures.qmd
        text: Lectures
        icon: mortarboard
      - href: tutorials.qmd
        text: Tutorials
        icon: tools
      - href: assignments.qmd
        text: Assignments
        icon: pencil-square
      - href: https://danilofreire.github.io/datasci151-summer/jupyter
        text: Jupyter Lite
        icon: rocket-takeoff
      - href: LICENSE.html
        text: " "
  page-footer:
    left: "Copyright 2026, Danilo Freire. The content of this site is licensed under the [MIT License](LICENSE.qmd)."
    right:
      - icon: github
        href: https://github.com/danilofreire/datasci151-summer

format:
  html:
    theme:
      light: [cosmo, custom.scss]
      dark: [darkly, custom.scss, custom-dark.scss]
    css: styles.css
    mainfont: "Source Sans 3"
    monofont: "Inconsolata"
    highlight-style: github
    toc: true
